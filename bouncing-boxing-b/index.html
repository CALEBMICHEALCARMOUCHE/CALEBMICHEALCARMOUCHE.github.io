    />

      id="burgerking" 
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSI44KMQ_zZz0hpJckPg3JYj5vsJuIKPj2oArOM4lesis3SZnN:https://i.pinimg.com/736x/49/02/64/49026489e6730781e1c007385c25b5bc.jpg&s"

    <canvas id="canvas" height="10" width="10"></canvas>

<script>
  const speed = 200; // in pixels
  const updateTime = 1 / 60;

  const sizeX = 200;
  const sizeY = 200;

  const speedMin = 100;
  const speedMax = 300;

  const clickSound = new Audio(
    "https://commondatastorage.googleapis.com/codeskulptor-assets/Collision8-Bit.ogg",
  );

  let canvas = document.getElementById("canvas");
  let ctx = canvas.getContext("2d");

  let diamond = document.getElementById("diamond");
  let dirt = document.getElementById("dirt")
  let brenda = document.getElementById("brenda")
  let burgerKing = document.getElementById("burgerking")

  let myBoxes = [];

  function getRandomInt(min, max) {
    const minCeiled = Math.ceil(min);
    const maxFloored = Math.floor(max);
    return Math.floor(Math.random() * (maxFloored - minCeiled) + minCeiled); 
  }

  function addNewBox() {
    let newBox = {
      directionX: 1,
      directionY: 1,
      positionX: window.innerWidth * Math.random(),
      positionY: window.innerHeight * Math.random(),
      speed: getRandomInt(speedMin, speedMax),
      width: sizeX,
      height: sizeY
    };

    if (Math.random() > 0.5) {
      newBox.directionX = -1;
    }

    if (Math.random() > 0.5) {
      newBox.directionY = -1;
    }

    let box = dirt 
    let rand = Math.random()

    if (rand < .1) {
      box = brenda 
    } else if (rand < .5) {
      box = diamond
    } else {
      box = burgerKing 
    }

    newBox.boxElement = box 

    myBoxes.push(newBox);
  }

  function playCollide() {
    const clickSound = new Audio(
      "https://commondatastorage.googleapis.com/codeskulptor-assets/Collision8-Bit.ogg",
    );
    clickSound.play();
  }

  function boxCollisions(box1, box2) {
    let overlapX = box1.positionX + box1.width >= box2.positionX && box2.positionX + box2.width >= box1.positionX
    let overlapY = box1.positionY + box1.height >= box2.positionY && box2.positionY + box2.height >= box1.positionY

    if (overlapX && overlapY) {
      box1.directionX = -box1.directionX
      box1.directionY = -box1.directionY
    }
  }

  function update() {
    const windowSizeX = window.innerWidth;
    const windowSizeY = window.innerHeight;

    canvas.width = windowSizeX;
    canvas.height = windowSizeY;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    myBoxes.forEach(function (boxInfo) {
      let change = boxInfo.speed * updateTime;

      boxInfo.positionX = boxInfo.positionX + change * boxInfo.directionX;
      boxInfo.positionY = boxInfo.positionY + change * boxInfo.directionY;

      if (boxInfo.positionX + sizeX > windowSizeX) {
        boxInfo.directionX = -1;
        playCollide();
      }

      if (boxInfo.positionX < 0) {
        boxInfo.directionX = 1;
        playCollide();
      }

      if (boxInfo.positionY + sizeY > windowSizeY) {
        boxInfo.directionY = -1;
        playCollide();
      }

      if (boxInfo.positionY < 0) {
        boxInfo.directionY = 1;
        playCollide();
      }

      //myBoxes.forEach(function (collidingBox) {
      //  boxCollisions(boxInfo, collidingBox)
      //})

      ctx.drawImage(boxInfo.boxElement, boxInfo.positionX, boxInfo.positionY, sizeX, sizeY);
    });
  }

  for (i=0;i<676;i++) {
      addNewBox()
  }

  setInterval(update, updateTime);

  canvas.addEventListener("click", addNewBox);
</script>
